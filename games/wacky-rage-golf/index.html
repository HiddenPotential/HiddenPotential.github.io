<body>
  <header class="nav">
    <a class="brand" href="/" aria-label="Anna Wang, homepage">AW</a>
    <button class="theme-toggle" id="theme-toggle" aria-label="Switch between notebook and chalkboard theme" title="Switch theme">
      <span class="icon-sun" aria-hidden="true">☀️</span><span class="icon-moon" aria-hidden="true">🌙</span>
    </button>
  </header>

  <main>
    <section class="section game-page" aria-labelledby="game-title">
      <a class="back" href="/#games">← All my games</a>
      <h1 id="game-title"><span class="highlight">Wacky Rage Golf</span> ⛳</h1>
      <p class="play-note">Drag on the course to pull back and aim, then let go to swing. Every hole has a nasty surprise waiting for you. Good luck! 😡</p>
      <div class="game-frame">
        <iframe src="/golf/" title="Wacky Rage Golf, a mini golf game by Anna Wang" allow="autoplay"></iframe>
      </div>
    </section>
  </main>

  <footer class="footer">
    <span>made with ♥ by <a href="/">Anna Wang</a> · 2026</span>
  </footer>

  <script src="/script.js" defer></script>
  <script>
    // The golf game doesn't report its height like the arcade does, so measure it here
    // (it's on this site, so we can look inside the frame) and fit the frame to it.
    (() => {
      const frame = document.querySelector(".game-frame iframe");
      const fit = () => {
        const d = frame.contentDocument, last = d && d.getElementById("item");
        if (last) frame.style.height = Math.ceil(last.getBoundingClientRect().bottom + 16) + "px";
      };
      frame.addEventListener("load", () => {
        fit();
        new ResizeObserver(fit).observe(frame.contentDocument.body);
      });
      window.addEventListener("resize", fit);
    })();
  </script>
</body>
